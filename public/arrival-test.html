<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival popup preview</title>
<style>
  body { margin: 0; min-height: 100vh; background: #101623; color: #cfd6e4;
    font-family: "Roboto Condensed", Arial, sans-serif; display: grid; place-items: center; text-align: center; }
  main { max-width: 560px; padding: 40px 24px; }
  h1 { color: #FEF200; font-size: 26px; margin: 0 0 10px; }
  p { line-height: 1.55; }
  a.mode { display: inline-block; margin: 8px 6px 0; padding: 12px 22px; border-radius: 10px;
    background: #FEF200; color: #101623; font-weight: 700; text-decoration: none; }
  a.back { color: #8e93a3; }
</style>
</head>
<body>
<main>
  <h1>Arrival popup preview</h1>
  <p>This page stands in for bwanabet.com. Pick an audience to see the popup a promo-site visitor gets when they arrive:</p>
  <p>
    <a class="mode" href="?wof=new">New player (register)</a>
    <a class="mode" href="?wof=existing">Existing player (sign in)</a>
  </p>
  <p><a class="back" href="/review.html">Back to the review page</a></p>
</main>
<script>
  // The popup shows once per session on the real site; on this preview always
  // clear the latch so every visit demonstrates it.
  try { sessionStorage.removeItem('bwanabet_wof_arrival_shown'); } catch (e) {}
</script>
<script src="/embed.js"></script>
</body>
</html>
